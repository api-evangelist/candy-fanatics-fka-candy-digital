name: Candy Fanatics (fka Candy Digital)
description: 'Candy Digital (branded simply as "Candy") is a digital collectibles platform operating
  at candy.io under the tagline "Crave. Collect. Connect." It is best known for officially licensed
  Major League Baseball (MLB) digital trading cards and NFT drops, sold through a consumer-facing,
  wallet-native web application for buying, collecting, and trading licensed digital collectibles.
  Founded in 2021 and backed by investors including Insight Partners, the company runs an active
  consumer product (e.g. the 2026 MLB Base Series drops). The former candy.com domain has since been
  divested and is now listed for acquisition via Hilco Digital Assets; the live brand and product run
  at candy.io. Candy Digital is a consumer-facing product and does not currently publish a public API
  program, developer portal, SDKs, or OpenAPI — this profile captures its real public web surface.'
